<app-header></app-header>

<div class="create-page">
  <div class="create-page__container">
    <div class="create-page__logo">m</div>

    <h1 class="create-page__title">
      Enter Your Mobile <br />
      Number
    </h1>

    <p class="create-page__subtitle">We will send a verification code to this number</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="label">Mobile Number</label>

      <!-- Reusable Phone Input Component:
           - Includes PrimeNG p-select + input
           - Loads countries from RestCountries
           - Keeps +ISO inside input (compactDisplay true => +96170377444)
           - Auto updates p-select based on typed +code
           - Mobile-only validation + max length enforcement
           - Emits E.164 to parent -->
      <app-phone-input
        [defaultIso]="'LB'"
        [onlyMobile]="true"
        [compactDisplay]="true"
        (valueChange)="onPhoneValueChange($event)"
        (validChange)="onPhoneValidChange($event)"
      ></app-phone-input>

      <app-primary-button
        class="btn"
        label="Next"
        [disabled]="!form.get('valid')?.value || !phoneE164"
      ></app-primary-button>
    </form>
  </div>
</div>
