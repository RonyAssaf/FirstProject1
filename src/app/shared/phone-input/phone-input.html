<div class="phone-field">
  <p-select
    class="country-select"
    [options]="countries"
    [(ngModel)]="selectedCountry"
    (onChange)="onCountryChange($event.value)"
    optionLabel="code"
    [filter]="true"
    filterBy="name"
    [showClear]="false"
    [ngModelOptions]="{ standalone: true }"
  >
    <!-- Selected ISO (LB) -->
    <ng-template #selectedItem let-selectedOption>
      <div class="country-selected" *ngIf="selectedOption">
        <span class="iso">{{ selectedOption.code }}</span>
      </div>
    </ng-template>

    <!-- Items -->
    <ng-template #item let-country>
      <div class="country-item">
        <img class="flag" [src]="country.flagPng" alt="" />
        <span class="name">{{ country.name }}</span>
        <span class="dial">{{ country.dialCode }}</span>
      </div>
    </ng-template>
  </p-select>

  <div class="sep"></div>

  <input
    class="phone-input"
    type="tel"
    inputmode="tel"
    autocomplete="tel"
    [formControl]="phoneCtrl"
    (input)="onPhoneInput($event)"
    placeholder="Mobile Number"
  />
</div>
<div class="field-error" *ngIf="phoneCtrl.dirty && phoneCtrl.value && phoneCtrl.errors">
  <small class="error-text" *ngIf="phoneCtrl.errors['invalidPhone']">
    Phone number is not valid
  </small>

  <small class="error-text" *ngIf="phoneCtrl.errors['notMobile']">
    Phone number is not a mobile number
  </small>
</div>
